```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Budget Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Simple Budget & Expense Tracker</p>
    </header>

    <main class="container">

        <section class="hero">
            <h2>Manage Your Money Wisely</h2>
            <p>
                Enter your budget and expenses to calculate your
                remaining balance.
            </p>

            <button id="startButton">Start Budget Calculation</button>
        </section>

        <section class="results">
            <h2>Budget Summary</h2>

            <div class="cards">

                <div class="card">
                    <h3>Budget</h3>
                    <p id="budgetDisplay">KES 0</p>
                </div>

                <div class="card">
                    <h3>Expenses</h3>
                    <p id="expensesDisplay">KES 0</p>
                </div>

                <div class="card">
                    <h3>Remaining Balance</h3>
                    <p id="balanceDisplay">KES 0</p>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 SpendWise. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
